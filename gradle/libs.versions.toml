[versions]
agp = "9.4.1"
androidAsyncHttp = "1.4.11"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
coreKtx = "1.19.1"
espressoCore = "3.7.0"
gradle = "9.4.1"
gson = "2.14.0"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlinGradlePlugin = "2.4.20"
kotlinx = "1.11.0"
navigation = "2.10.2"
preferenceKtx = "1.2.1"
volley = "1.2.1"

[libraries]
android-async-http = { group = "com.loopj.android", name = "android-async-http", version.ref = "androidAsyncHttp" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlinGradlePlugin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx" }
